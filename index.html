<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar with Clocks & Alarms</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="main-content">
            <div class="calendar-container">
                <div class="calendar-header">
                    <button id="prevMonth">&lt;</button>
                    <h2 id="monthYear"></h2>
                    <button id="nextMonth">&gt;</button>
                </div>
                <div class="weekdays">
                    <div>Sun</div>
                    <div>Mon</div>
                    <div>Tue</div>
                    <div>Wed</div>
                    <div>Thu</div>
                    <div>Fri</div>
                    <div>Sat</div>
                </div>
                <div id="calendar" class="days"></div>
            </div>
            
            <div class="clocks-container">
                <div class="analog-clock">
                    <div class="clock-face">
                        <div class="center-point"></div>
                        <div class="hour-hand"></div>
                        <div class="minute-hand"></div>
                        <div class="second-hand"></div>
                        <div class="hour-markers"></div>
                    </div>
                </div>
                
                <div class="digital-clock">
                    <div id="digital-time"></div>
                    <div id="digital-date"></div>
                </div>
            </div>
        </div>
        
        <div class="alarm-container">
            <h2>Alarms</h2>
            <div class="alarm-form">
                <input type="time" id="alarmTime">
                <button id="setAlarm">Set Alarm</button>
            </div>
            <div class="alarms-list" id="alarmsList">
                <!-- Alarms will be added here -->
            </div>
        </div>
    </div>
    <script src="script.js"></script>

</body>
</html>
