<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar with Clocks & Alarms</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="top-buttons">
            <button id="alarmButton" class="top-button alarm-button">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2zm-2 1H8v-6c0-2.48 1.51-4.5 4-4.5s4 2.02 4 4.5v6z" fill="currentColor"/>
                </svg>
                <span class="alarm-count" id="alarmCount"></span>
            </button>
            
            <div class="voice-button-container">
                <button id="voiceMode" class="voice-button">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z" fill="currentColor"/>
                        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z" fill="currentColor"/>
                    </svg>
                    <span>Voice Mode</span>
                </button>
                <div id="voiceStatus" class="voice-status">Inactive</div>
            </div>
        </div>
        
        <div class="main-content">
            <div class="calendar-container">
                <div class="calendar-header">
                    <button id="prevMonth">&lt;</button>
                    <h2 id="monthYear"></h2>
                    <button id="nextMonth">&gt;</button>
                </div>
                <div class="weekdays">
                    <div>Sunday</div>
                    <div>Monday</div>
                    <div>Tuesday</div>
                    <div>Wednesday</div>
                    <div>Thursday</div>
                    <div>Friday</div>
                    <div>Saturday</div>
                </div>
                <div id="calendar" class="days"></div>
            </div>
            
            <div class="clocks-container">
                <div class="analog-clock">
                    <div class="clock-face">
                        <div class="center-point"></div>
                        <div class="hour-hand"></div>
                        <div class="minute-hand"></div>
                        <div class="second-hand"></div>
                        <div class="hour-markers"></div>
                    </div>
                </div>
                
                <div class="digital-clock">
                    <div id="digital-time"></div>
                    <div id="digital-date"></div>
                </div>
            </div>
        </div>

        <!-- Alarm Modal -->
        <div id="alarmModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Alarms</h2>
                    <button id="closeAlarmModal" class="close-button">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="alarm-form">
                        <div class="form-group">
                            <label for="alarmTitle">Title</label>
                            <input type="text" id="alarmTitle" placeholder="Alarm Title">
                        </div>
                        <div class="form-group">
                            <label for="alarmTime">Time</label>
                            <input type="time" id="alarmTime">
                        </div>
                        <div class="form-group">
                            <label for="alarmSound">Sound</label>
                            <select id="alarmSound">
                                <option value="beep">Beep</option>
                                <option value="digital">Digital</option>
                                <option value="chime">Chime</option>
                                <option value="bell">Bell</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="alarmDuration">Duration (seconds)</label>
                            <input type="number" id="alarmDuration" min="5" max="60" value="30">
                        </div>
                        <div class="form-group">
                            <label>Repeat</label>
                            <div class="repeat-options">
                                <label><input type="radio" name="repeat" value="once" checked> Once</label>
                                <label><input type="radio" name="repeat" value="daily"> Daily</label>
                                <label><input type="radio" name="repeat" value="custom"> Custom</label>
                            </div>
                        </div>
                        <div id="customDays" class="form-group custom-days">
                            <div class="weekday-selector">
                                <label><input type="checkbox" value="0"> Sun</label>
                                <label><input type="checkbox" value="1"> Mon</label>
                                <label><input type="checkbox" value="2"> Tue</label>
                                <label><input type="checkbox" value="3"> Wed</label>
                                <label><input type="checkbox" value="4"> Thu</label>
                                <label><input type="checkbox" value="5"> Fri</label>
                                <label><input type="checkbox" value="6"> Sat</label>
                            </div>
                        </div>
                        <button id="setAlarm" class="set-alarm-btn">Set Alarm</button>
                    </div>
                    
                    <div class="alarms-list">
                        <h3>Active Alarms</h3>
                        <div id="alarmsList"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Alarm Alert Overlay -->
        <div id="alarmOverlay" class="alarm-overlay">
            <div class="alarm-alert">
                <div class="alarm-alert-content">
                    <h2 id="alarmAlertTitle">Alarm Title</h2>
                    <div class="alarm-time" id="alarmAlertTime">00:00</div>
                    <div class="alarm-buttons">
                        <button id="snoozeAlarm" class="alarm-btn snooze-btn">Snooze</button>
                        <button id="dismissAlarm" class="alarm-btn dismiss-btn">Dismiss</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="voiceResponse" class="voice-response" aria-live="polite"></div>
    </div>
    <!-- Module scripts -->
    <script src="js/utils.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/holidays.js"></script>
    <script src="js/calendar.js"></script>
    <script src="js/clock.js"></script>
    <script src="js/alarm.js"></script>
    <script src="js/voice.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
